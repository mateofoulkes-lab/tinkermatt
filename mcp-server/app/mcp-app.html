<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TinkerMatt</title>
    <style>
      :root {
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color-scheme: light dark;
      }
      * { box-sizing: border-box; }
      body { margin: 0; padding: 12px; background: transparent; }
      .card {
        border: 1px solid color-mix(in srgb, currentColor 16%, transparent);
        border-radius: 16px;
        padding: 14px;
        background: color-mix(in srgb, Canvas 94%, transparent);
        box-shadow: 0 6px 24px color-mix(in srgb, currentColor 8%, transparent);
      }
      .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
      .brand { display: flex; align-items: center; gap: 9px; font-weight: 750; font-size: 16px; }
      .mark { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; background: color-mix(in srgb, #7c3aed 18%, Canvas); }
      .status { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 650; padding: 5px 8px; border-radius: 999px; background: color-mix(in srgb, currentColor 8%, transparent); }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: #9ca3af; }
      .status.online .dot { background: #22c55e; }
      .status.offline .dot { background: #ef4444; }
      .grid { margin-top: 14px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
      .item { padding: 10px; border-radius: 12px; background: color-mix(in srgb, currentColor 5%, transparent); min-width: 0; }
      .label { font-size: 11px; opacity: .62; margin-bottom: 4px; }
      .value { font-size: 13px; font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .actions { display: flex; gap: 8px; margin-top: 12px; }
      button {
        appearance: none; border: 0; border-radius: 10px; padding: 9px 12px; font: inherit; font-size: 12px; font-weight: 700; cursor: pointer;
        background: color-mix(in srgb, #7c3aed 88%, Canvas); color: white;
      }
      button.secondary { background: color-mix(in srgb, currentColor 9%, Canvas); color: CanvasText; }
      button:disabled { opacity: .55; cursor: default; }
      .message { margin-top: 10px; font-size: 11px; opacity: .65; min-height: 1.4em; }
      @media (max-width: 420px) { .grid { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <section class="card">
      <div class="top">
        <div class="brand"><span class="mark">🔧</span><span>TinkerMatt</span></div>
        <div id="statusPill" class="status"><span class="dot"></span><span id="statusText">Consultando…</span></div>
      </div>
      <div class="grid">
        <div class="item"><div class="label">Proyecto</div><div id="project" class="value">—</div></div>
        <div class="item"><div class="label">Versión</div><div id="version" class="value">—</div></div>
        <div class="item"><div class="label">Editor</div><div id="editor" class="value">—</div></div>
        <div class="item"><div class="label">Conectado desde</div><div id="connectedAt" class="value">—</div></div>
      </div>
      <div class="actions">
        <button id="refresh">Actualizar estado</button>
        <button id="scene" class="secondary">Leer escena</button>
      </div>
      <div id="message" class="message"></div>
    </section>
    <script type="module" src="/app/mcp-app.ts"></script>
  </body>
</html>
