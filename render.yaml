services:
  - type: web
    name: tinkermatt-mcp
    runtime: node
    plan: free
    rootDir: mcp-server
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: PUBLIC_BASE_URL
        value: https://tinkermatt-mcp.onrender.com
      - key: ALLOWED_EDITOR_ORIGINS
        value: https://mateofoulkes-lab.github.io
